---
# Inputs for the vanilla AL2023 Docker Hub container.
# Containers cannot meaningfully satisfy a number of host-level controls
# (boot loader, FIPS, physical protections, etc.), so the relevant
# environmental flags are set here for the scan.

disable_slow_controls: false
data_at_rest_exempt: false
smart_card_enabled: false
external_firewall: false
allow_container_openssh_server: false
physical_protections_employed: false
