---
# SAF CLI threshold gate for the Iron Bank hardened AL2023 container scan.
# error.total.max MUST stay 0 — any profile (control execution) error fails
# the gate, regardless of compliance score.
# compliance.min is set low (40) because the current hardened container scores
# ~42%; it appears to be a degraded image. Tune this upward as the image matures.
error.total.max: 0
compliance.min: 40
