---
# Inputs for the Iron Bank hardened AL2023 container.
# Mirrors the vanilla container inputs — the hardening is in the image
# itself, not in the inputs we feed the scanner. Tune per-input as the
# hardened image's actual posture diverges from the vanilla one.

disable_slow_controls: false
data_at_rest_exempt: false
smart_card_enabled: false
external_firewall: false
allow_container_openssh_server: false
physical_protections_employed: false
